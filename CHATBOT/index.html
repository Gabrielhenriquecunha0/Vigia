<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIGIA - Chat</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    
<div class="chat-container">
    <div class="chat-header">
         <img src="DETETIVE DE MALANDRO.avif" alt="Avatar" class="avatar">
        <div class="info">
            <span class="name">Watchman</span>
            <span class="status">Online</span>
        </div>
    </div>

    <div class="chat-messages" id="chatBox">
        <div class="message bot">
            <div class="bubble">Olá! Eu sou o Vigia. Como posso te ajudar com peças de hardware hoje?</div>
        </div>
    </div>

    <div class="chat-input">
        <input type="text" id="userInput" placeholder="Digite sua mensagem...">
        <button onclick="sendMessage()">Enviar</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const input = document.getElementById('userInput');
        const chatBox = document.getElementById('chatBox');
        const message = input.value.trim();

        if (!message) return;

        chatBox.innerHTML += `<div class="message user"><div class="bubble">${message}</div></div>`;
        input.value = '';
        
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch('http://127.0.0.1:5000/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            });
            
            const data = await response.json();

            const respostaConvertida = marked.parse(data.response);

       
            chatBox.innerHTML += `<div class="message bot"><div class="bubble">${respostaConvertida}</div></div>`;
            
        
            chatBox.scrollTop = chatBox.scrollHeight;

        } catch (error) {
            console.error("Erro:", error);
            chatBox.innerHTML += `<div class="message bot"><div class="bubble">Ops, o servidor deu erro.</div></div>`;
        }
    }

    document.getElementById('userInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>

</body>
</html>
